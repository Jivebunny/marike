# Site settings
baseURL = "https://jivebunny.github.io/"
locale = "nl-NL"
title = "Marike Holtmaat - Corver | Zelfstandig Financial Controller"
description = "Zelfstandig Financieel Controlle Marike Holtmaat - Corver heeft meer dan 14 jaar ervaring als Accountant, Auditor en Controller"
theme = "split"
disableKinds = ["section", "taxonomy", "RSS", "sitemap"]
disableHugoGeneratorInject = true

# Local preview mode
relativeURLs = true
uglyURLs = true

# Copyright
copyright = "&copy;2026 Marike Holtmaat - Corver"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[services]
  [services.googleAnalytics]
    # Enter your tracking code to enable Google Analytics
    ID = "G-2RR0H98VNC"

[params]

  # Metadata for search engines and social sharing
  author = "Marike Holtmaat - Corver"
  description = "Marike is een zelfstandig Financial Controller"
  shareImage = "images/background.jpg"
  #twitterHandle = "onepagelove"

  # Whether you purchased the license from the author.
  licensed = true

  # Favicon
  favicon = "favicon.ico"

  # Section - Visual
  [params.visual]

    # Image
    [params.visual.image]
      enable = true
      file = "images/background.jpg"
      position = "center center"

    # Video
    [params.visual.video]
      enable = false
      mute = true
      file = "videos/background.mp4"
      # youtubeId = "dk9uNWPP7EA"

  # Links
  #
  # Links List #1
  [[params.links]]
    [params.links.list1]
      heading = "Contact"

      [[params.links.list1.link]]
        text = "Scan mijn gegevens"
        url = "/qr-code.html"
        new_tab = true 

      [[params.links.list1.link]]
        text = "Zet mij in je adresboek"
        url = "vcf/MarikeHoltmaat - Corver.vcf"
        new_tab = false 
      
      [[params.links.list1.link]]
        text = "Bel mij"
        url = "tel:+31618446948"
        new_tab = false # Default, open at same tab

      [[params.links.list1.link]]
        text = "E-mail"
        url = "mailto:m.holtmaat@hcmfinance.nl"
        new_tab = false # Default, open at same tab
      
      [[params.links.list1.link]]
        text = "Linkedin"
        url = "https://www.linkedin.com/in/marike-holtmaat-corver-5b849149/"
        new_tab = true # new tab
  
  # Links List #2
  [[params.links]]
    [params.links.list2]
      heading = "Social"

      [[params.links.list2.link]]
        text = "Linkedin"
        url = "https://www.linkedin.com/in/marike-holtmaat-corver-5b849149/"
        new_tab = true # new tab

      [[params.links.list2.link]]
        text = "Instagram"
        url = "#"

      [[params.links.list2.link]]
        text = "Youtube"
        url = "#"

  # Links List #3
  [[params.links]]
    [params.links.list3]
      heading = "Portfolio"

       [[params.links.list3.link]]
        text = "Link One"
        url = "#"

     [[params.links.list3.link]]
        text = "Link Two"
        url = "#"

      [[params.links.list3.link]]
        text = "Link Three"
        url = "#"

